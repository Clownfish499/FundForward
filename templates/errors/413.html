{% extends "base.html" %}
{% block title %}File Too Large — FundForward{% endblock %}
{% block content %}
<div class="container" style="text-align: center; padding: 5rem 1rem;">
  <h1 style="font-size: 2.5rem; color: var(--navy);">File Too Large (413)</h1>
  <p style="color: var(--text-muted); margin-bottom: 1.5rem;">Uploaded files must be 5 MB or smaller.</p>
  <a href="{{ url_for('campaign.create_campaign_view') }}" class="btn btn-primary">Try Again</a>
</div>
{% endblock %}
